name: Update Tidbyt

on:
  workflow_dispatch: {}
  schedule:
    # Times are UTC. Each run refreshes the Tidbyt every 60 seconds for as long as
    # a game is live (or kicks off within the hour), then stops on its own.
    # These starts just make sure a run is going during NFL game windows.
    - cron: "5,35 16-23 * * 0"   # Sunday early + late games
    - cron: "5,35 0-4 * * 1"     # Sunday night football
    - cron: "5,35 23 * * 1,4"    # Monday / Thursday night
    - cron: "5,35 0-4 * * 2,5"   # Monday / Thursday night
    - cron: "5,35 17-23 * * 6"   # Saturday games (late season)
    - cron: "17 */6 * * *"       # Off-hours check: new week, final scores

concurrency:
  group: tidbyt
  cancel-in-progress: false      # never kill a running live loop; extra starts wait their turn

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Sleeper player list (refreshed daily)
        uses: actions/cache@v4
        with:
          path: .cache
          key: players-${{ github.run_id }}
          restore-keys: players-
      - run: pip install -r requirements.txt
      - name: Refresh Tidbyt every minute while games are on
        env:
          TIDBYT_DEVICE_ID: ${{ secrets.TIDBYT_DEVICE_ID }}
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_API_URL: ${{ vars.TIDBYT_API_URL }}
        run: python sleeper_tidbyt.py --loop --interval 60 --max-minutes 345
